[package]
name = "zero2prod"
version = "0.1.0"
edition = "2024"
authors = ["Artem Lytvyn", "Luca Palmieri"]

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "zero2prod"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
actix-web = "4"
dotenv = "0.15.0"
reqwest = "0.13.1"
serde = { version = "1.0.228", features = ["derive"] }
config = "0.15.19"
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
uuid = { version = "1.19.0", features = ["v4"] }

[dependencies.sqlx]
version = "0.8.6"
default-features = false
features = [
    "runtime-tokio-rustls",
    "macros",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
]
